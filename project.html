<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBFF">
<title>실적공수 · 프로젝트 등록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FAFBFF;--bg2:#F1F4FC;--sf:#fff;--tx:#0B0F1A;--tx2:#3E4A63;--mu:#7482A0;--ln:#E4E9F5;--ln2:#CFD8EC;
  --c1:#4F6BFF;--ok:#10B981;--warn:#FB7185;--grad:linear-gradient(120deg,#4F6BFF,#8B5CF6 45%,#22D3EE);
  --sh:0 1px 2px rgba(11,15,26,.04),0 12px 32px -18px rgba(30,48,110,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;letter-spacing:-.01em;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
header h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.user{font-size:13px;color:var(--tx2);display:flex;gap:10px;align-items:center}
.user button{font:inherit;font-size:12px;border:1px solid var(--ln2);background:var(--sf);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--tx2)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-bottom:5px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--ln2);border-radius:11px;background:var(--sf);color:var(--tx);outline:none}
input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(79,107,255,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:11px;padding:12px 18px;cursor:pointer;color:#fff;background:var(--grad);width:100%;box-shadow:0 12px 24px -12px rgba(79,107,255,.6)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:10px;font-size:13.5px;padding:10px 12px;border-radius:10px;display:none}
.msg.ok{display:block;background:#E6F6EF;color:#0B7A4F;border:1px solid #BFE6D3}
.msg.err{display:block;background:#FDECEE;color:#B3364A;border:1px solid #F7C6CD}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tools input{flex:1}
.cnt{font-size:12.5px;color:var(--mu);white-space:nowrap}
.list{border-top:1px solid var(--ln)}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--ln)}
.item .no{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--c1);font-weight:700}
.item .nm{font-size:14.5px;margin-top:2px}
.item button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--ln2);background:var(--sf);color:var(--tx2);border-radius:999px;padding:6px 12px;cursor:pointer}
.item button:hover{border-color:var(--warn);color:var(--warn)}
.empty{padding:28px 0;text-align:center;color:var(--mu);font-size:14px}
#login{display:none}#app{display:none}
.hint{font-size:12.5px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login">
    <header><h1><span>실적공수</span> 프로젝트 등록</h1></header>
    <div class="card">
      <h2>본인 확인</h2>
      <div class="row">
        <div><label>이름</label><input id="lgName" placeholder="홍길동" autocomplete="off"></div>
        <div><label>휴대폰 뒷 4자리</label><input id="lgPhone" type="tel" inputmode="numeric" maxlength="4" placeholder="0000"></div>
      </div>
      <button class="btn" id="lgBtn" onclick="doLogin()">확인</button>
      <div class="msg" id="lgMsg"></div>
      <p class="hint">한 번 확인하면 이 기기에서는 로그아웃 전까지 유지됩니다.</p>
    </div>
  </div>

  <!-- 본화면 -->
  <div id="app">
    <header>
      <h1><span>실적공수</span> 프로젝트 등록</h1>
      <div class="user"><span id="uName"></span><button onclick="logout()">로그아웃</button></div>
    </header>

    <div class="card">
      <h2>새 프로젝트 등록</h2>
      <div class="row">
        <div><label>프로젝트번호</label><input id="pNo" placeholder="ERP에서 복사해 붙여넣기" autocomplete="off"></div>
        <div><label>프로젝트명</label><input id="pName" placeholder="ERP에서 복사해 붙여넣기" autocomplete="off"></div>
      </div>
      <button class="btn" id="addBtn" onclick="addProject()">등록</button>
      <div class="msg" id="addMsg"></div>
      <p class="hint">ERP에 등록한 프로젝트명·번호를 그대로 붙여넣으세요. 앞뒤 공백은 자동으로 제거됩니다.</p>
    </div>

    <div class="card">
      <h2>등록된 프로젝트</h2>
      <div class="tools">
        <input id="q" placeholder="프로젝트명 또는 번호 검색" oninput="render()" autocomplete="off">
        <span class="cnt" id="cnt"></span>
      </div>
      <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>

</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbxFvUeZuXCSiZkl5PQ18tN2Xet4lTYUbidn_RRgtcekj8Vhj7kg2uvGf_5OzjA9baY/exec";
var KEY = 'ETS_LABOR_USER';
var USER = null, PROJECTS = [];

function api(payload){
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); });
}
function show(id, ok, text){ var el=document.getElementById(id); el.className='msg '+(ok?'ok':'err'); el.textContent=text; }
function hide(id){ document.getElementById(id).className='msg'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ---- 로그인 ----
function doLogin(){
  var name=document.getElementById('lgName').value.trim();
  var p4=document.getElementById('lgPhone').value.trim();
  if(!name||p4.length!==4){ show('lgMsg',false,'이름과 휴대폰 뒷 4자리를 입력하세요.'); return; }
  var b=document.getElementById('lgBtn'); b.disabled=true; b.textContent='확인 중…';
  api({action:'login', name:name, phone4:p4}).then(function(d){
    b.disabled=false; b.textContent='확인';
    if(d.ok && d.user){
      USER=d.user; localStorage.setItem(KEY, JSON.stringify(USER)); enter();
    } else if(d.ok && d.multiple){
      show('lgMsg',false,'동일 정보의 직원이 여러 명입니다. 관리자에게 문의하세요.');
    } else {
      show('lgMsg',false,d.msg||'일치하는 직원이 없습니다.');
    }
  }).catch(function(){ b.disabled=false; b.textContent='확인'; show('lgMsg',false,'서버 연결 오류. 잠시 후 다시 시도하세요.'); });
}
function logout(){ localStorage.removeItem(KEY); location.reload(); }
function enter(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('uName').textContent=USER.name+(USER.dept?' · '+USER.dept:'');
  load();
}

// ---- 프로젝트 ----
function load(){
  api({action:'listProjects'}).then(function(d){
    PROJECTS = d.ok ? d.list : [];
    render();
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>'; });
}
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=PROJECTS.filter(function(p){ return !q || p.no.toLowerCase().indexOf(q)>=0 || p.name.toLowerCase().indexOf(q)>=0; });
  document.getElementById('cnt').textContent = rows.length+' / '+PROJECTS.length+'건';
  if(!rows.length){ document.getElementById('list').innerHTML='<div class="empty">'+(PROJECTS.length?'검색 결과가 없습니다.':'등록된 프로젝트가 없습니다.')+'</div>'; return; }
  document.getElementById('list').innerHTML = rows.map(function(p){
    return '<div class="item"><div><div class="no">'+esc(p.no)+'</div><div class="nm">'+esc(p.name)+'</div></div>'+
           '<button onclick="deactivate(\''+esc(p.no)+'\')">비활성</button></div>';
  }).join('');
}
function addProject(){
  var no=document.getElementById('pNo').value.trim(), name=document.getElementById('pName').value.trim();
  if(!no||!name){ show('addMsg',false,'프로젝트번호와 프로젝트명을 모두 입력하세요.'); return; }
  var b=document.getElementById('addBtn'); b.disabled=true; b.textContent='등록 중…'; hide('addMsg');
  api({action:'addProject', no:no, name:name}).then(function(d){
    b.disabled=false; b.textContent='등록';
    if(d.ok){
      show('addMsg',true,'등록되었습니다: '+no);
      document.getElementById('pNo').value=''; document.getElementById('pName').value='';
      document.getElementById('pNo').focus();
      load();
    } else show('addMsg',false,d.msg||'등록 실패');
  }).catch(function(){ b.disabled=false; b.textContent='등록'; show('addMsg',false,'서버 연결 오류. 다시 시도하세요.'); });
}
function deactivate(no){
  if(!confirm(no+' 을(를) 비활성 처리할까요?\n앱 목록에서만 사라지고 기록은 남습니다.')) return;
  api({action:'deactivate', no:no}).then(function(d){
    if(d.ok) load(); else alert(d.msg||'처리 실패');
  }).catch(function(){ alert('서버 연결 오류'); });
}

// ---- 시작 ----
(function(){
  try{ USER=JSON.parse(localStorage.getItem(KEY)); }catch(e){ USER=null; }
  if(USER && USER.name) enter(); else document.getElementById('login').style.display='block';
})();
</script>
</body>
</html>
